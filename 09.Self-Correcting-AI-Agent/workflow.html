<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the coding team works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --text: #1d1e22; --muted: #62646c; --line: #8c8e96;
  --box-fill: #f3f4f6; --box-stroke: #9a9ca4;
  --p-fill: #EEEDFE; --p-stroke: #534AB7; --p-title: #3C3489; --p-sub: #534AB7;
  --t-fill: #E1F5EE; --t-stroke: #0F6E56; --t-title: #085041; --t-sub: #0F6E56;
  --dot: #d0d1d6; --btn: #ffffff; --btn-border: #c4c5cb;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171b; --text: #ecedf0; --muted: #a3a5ad; --line: #8a8c94;
    --box-fill: #23252b; --box-stroke: #6b6d75;
    --p-fill: #3C3489; --p-stroke: #AFA9EC; --p-title: #EEEDFE; --p-sub: #CECBF6;
    --t-fill: #085041; --t-stroke: #5DCAA5; --t-title: #E1F5EE; --t-sub: #9FE1CB;
    --dot: #44464d; --btn: #23252b; --btn-border: #4a4c53;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
main { width: 100%; max-width: 820px; }
h1 { font-size: 22px; font-weight: 500; margin: 0 0 8px; }
svg { display: block; width: 100%; max-height: 58vh; margin: 0 auto; }
svg text { font-family: inherit; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-family: "IBM Plex Mono", ui-monospace, monospace; }
.box rect { fill: var(--box-fill); stroke: var(--box-stroke); }
.box .th { fill: var(--text); } .box .ts { fill: var(--muted); }
.purple rect { fill: var(--p-fill); stroke: var(--p-stroke); }
.purple .th { fill: var(--p-title); } .purple .ts { fill: var(--p-sub); }
.teal rect { fill: var(--t-fill); stroke: var(--t-stroke); }
.teal .th { fill: var(--t-title); } .teal .ts { fill: var(--t-sub); }
.arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
.head { stroke: var(--line); }
.k { transition: opacity .35s; }
.dim .k { opacity: .15; }
.dim .k.on { opacity: 1; }
.panel { margin-top: 16px; }
.dots { display: flex; gap: 6px; margin-bottom: 10px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
.dot.on { background: var(--text); }
.num { font-size: 14px; color: var(--muted); margin-bottom: 2px; }
.cap { font-size: 20px; line-height: 1.5; min-height: 60px; max-width: 70ch; }
.cap code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .9em; }
.controls { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
button {
  font: inherit; font-size: 15px; padding: 7px 16px; cursor: pointer;
  background: var(--btn); color: var(--text);
  border: 1px solid var(--btn-border); border-radius: 8px;
}
button:focus-visible { outline: 2px solid var(--p-stroke); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); margin-left: auto; }
@media (prefers-reduced-motion: reduce) { .k { transition: none; } }
</style>
</head>
<body>
<main>
<h1>How the coding team works</h1>

<svg id="wf" viewBox="0 0 680 420" role="img" aria-labelledby="t d">
<title id="t">Multi-agent coding workflow</title>
<desc id="d">The user sends a task to a main agent. The main agent sends instructions to a coder agent and a tester agent. Both work on files in a shared sandbox folder. Our code reruns pytest and sends a verified result to the main agent, which loops back to the coder on failure.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="k box" data-k="user"><rect x="270" y="20" width="140" height="44" rx="8" stroke-width="1"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">User</text></g>

<line class="arr k" data-k="a-um" x1="320" y1="66" x2="320" y2="106" marker-end="url(#arrow)"/>
<line class="arr k" data-k="a-mu" x1="360" y1="108" x2="360" y2="68" marker-end="url(#arrow)"/>

<g class="k purple" data-k="main"><rect x="230" y="110" width="220" height="56" rx="8" stroke-width="1"/>
<text class="th" x="340" y="129" text-anchor="middle" dominant-baseline="central">Main agent</text>
<text class="ts" x="340" y="148" text-anchor="middle" dominant-baseline="central">plans and delegates</text></g>

<g class="k box" data-k="ver"><rect x="480" y="110" width="150" height="56" rx="8" stroke-width="1" stroke-dasharray="4 3"/>
<text class="th" x="555" y="129" text-anchor="middle" dominant-baseline="central">Verified result</text>
<text class="ts" x="555" y="148" text-anchor="middle" dominant-baseline="central">code runs pytest</text></g>
<line class="arr k" data-k="a-vm" x1="478" y1="138" x2="454" y2="138" marker-end="url(#arrow)"/>

<line class="arr k" data-k="a-mc" x1="250" y1="168" x2="152" y2="226" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line class="arr k" data-k="a-cm" x1="200" y1="228" x2="288" y2="170" marker-end="url(#arrow)"/>
<line class="arr k" data-k="a-mt" x1="420" y1="168" x2="470" y2="226" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line class="arr k" data-k="a-tv" x1="555" y1="228" x2="555" y2="170" marker-end="url(#arrow)"/>

<g class="k teal" data-k="coder"><rect x="60" y="230" width="200" height="56" rx="8" stroke-width="1"/>
<text class="th" x="160" y="249" text-anchor="middle" dominant-baseline="central">Coder agent</text>
<text class="ts" x="160" y="268" text-anchor="middle" dominant-baseline="central">write_code, run_python</text></g>

<g class="k teal" data-k="tester"><rect x="420" y="230" width="200" height="56" rx="8" stroke-width="1"/>
<text class="th" x="520" y="249" text-anchor="middle" dominant-baseline="central">Tester agent</text>
<text class="ts" x="520" y="268" text-anchor="middle" dominant-baseline="central">write_tests, run_tests</text></g>

<line class="arr k" data-k="a-cs" x1="170" y1="288" x2="236" y2="338" marker-end="url(#arrow)"/>
<line class="arr k" data-k="a-ts" x1="510" y1="288" x2="444" y2="338" marker-end="url(#arrow)"/>

<g class="k box" data-k="sb"><rect x="200" y="340" width="280" height="56" rx="8" stroke-width="1"/>
<text class="th" x="340" y="359" text-anchor="middle" dominant-baseline="central">sandbox/ folder</text>
<text class="ts" x="340" y="378" text-anchor="middle" dominant-baseline="central">solution.py, test_solution.py</text></g>
</svg>

<div class="panel">
  <div class="dots" id="dots"></div>
  <div class="num" id="num">Overview</div>
  <div class="cap" id="cap" aria-live="polite"></div>
  <div class="controls">
    <button onclick="go(-1)">Previous</button>
    <button onclick="go(1)">Next</button>
    <button onclick="show(-1)">Show all</button>
    <span class="hint">Keys: ← → or space, Esc for overview</span>
  </div>
</div>
</main>

<script>
const OVERVIEW = "One main agent, two worker agents, one shared folder. Dashed arrows are instructions, solid arrows are replies.";
const S = [
  ["The user gives a task, like “calculate the average of a list”.", ["user","a-um","main"]],
  ["The main agent never writes code. It sends the task to the coder with <code>ask_coder</code>.", ["main","a-mc","coder"]],
  ["The coder writes <code>solve()</code> into <code>solution.py</code> and runs it once to check it works.", ["coder","a-cs","sb"]],
  ["The coder sends back a short summary, not the code. The file is the real handoff.", ["coder","a-cm","main"]],
  ["The main agent asks the tester to test it with <code>ask_tester</code>.", ["main","a-mt","tester"]],
  ["The tester writes up to 5 tests from the task, not from the code, and runs pytest.", ["tester","a-ts","sb"]],
  ["Our code reruns pytest itself and adds a verified result. The tester can’t fake it.", ["tester","a-tv","ver","a-vm","main"]],
  ["Tests failed? The main agent sends the failures back to the coder. Maximum 3 fixes.", ["ver","a-vm","main","a-mc","coder"]],
  ["All tests pass. The main agent reads the code and replies to the user.", ["main","a-mu","user","sb"]]
];
let i = -1;
const wf = document.getElementById("wf"), dots = document.getElementById("dots");
const num = document.getElementById("num"), cap = document.getElementById("cap");
S.forEach(() => { const d = document.createElement("span"); d.className = "dot"; dots.appendChild(d); });

function show(n) {
  i = n;
  wf.querySelectorAll(".k").forEach(e => e.classList.remove("on"));
  [...dots.children].forEach((d, j) => d.classList.toggle("on", j === n));
  if (n < 0) { wf.classList.remove("dim"); num.textContent = "Overview"; cap.innerHTML = OVERVIEW; return; }
  wf.classList.add("dim");
  S[n][1].forEach(k => wf.querySelectorAll('[data-k="' + k + '"]').forEach(e => e.classList.add("on")));
  num.textContent = "Step " + (n + 1) + " of " + S.length;
  cap.innerHTML = S[n][0];
}
function go(d) {
  let n = i + d;
  if (n >= S.length) n = -1;
  if (n < -1) n = S.length - 1;
  show(n);
}
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  else if (e.key === "Escape") { show(-1); }
});
show(-1);
</script>
</body>
</html>
