<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the research team works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --text: #1d1e22; --muted: #62646c; --line: #8c8e96;
  --box-fill: #f3f4f6; --box-stroke: #9a9ca4;
  --p-fill: #EEEDFE; --p-stroke: #534AB7; --p-title: #3C3489; --p-sub: #534AB7;
  --t-fill: #E1F5EE; --t-stroke: #0F6E56; --t-title: #085041; --t-sub: #0F6E56;
  --dot: #d0d1d6; --btn: #ffffff; --btn-border: #c4c5cb;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171b; --text: #ecedf0; --muted: #a3a5ad; --line: #8a8c94;
    --box-fill: #23252b; --box-stroke: #6b6d75;
    --p-fill: #3C3489; --p-stroke: #AFA9EC; --p-title: #EEEDFE; --p-sub: #CECBF6;
    --t-fill: #085041; --t-stroke: #5DCAA5; --t-title: #E1F5EE; --t-sub: #9FE1CB;
    --dot: #44464d; --btn: #23252b; --btn-border: #4a4c53;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
main { width: 100%; max-width: 820px; }
h1 { font-size: 22px; font-weight: 500; margin: 0 0 8px; }
svg { display: block; width: 100%; max-height: 58vh; margin: 0 auto; }
svg text { font-family: inherit; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-family: "IBM Plex Mono", ui-monospace, monospace; }
.box rect { fill: var(--box-fill); stroke: var(--box-stroke); }
.box .th { fill: var(--text); } .box .ts { fill: var(--muted); }
.purple rect { fill: var(--p-fill); stroke: var(--p-stroke); }
.purple .th { fill: var(--p-title); } .purple .ts { fill: var(--p-sub); }
.teal rect { fill: var(--t-fill); stroke: var(--t-stroke); }
.teal .th { fill: var(--t-title); } .teal .ts { fill: var(--t-sub); }
.tr { font-size: 12px; }
.purple .tr { fill: var(--p-title); } .teal .tr { fill: var(--t-title); }
.note { font-size: 12px; font-style: italic; fill: var(--muted); }
.arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
.head { stroke: var(--line); }
.k { transition: opacity .35s; }
.dim .k { opacity: .15; }
.dim .k.on { opacity: 1; }
.panel { margin-top: 16px; }
.dots { display: flex; gap: 6px; margin-bottom: 10px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
.dot.on { background: var(--text); }
.num { font-size: 14px; color: var(--muted); margin-bottom: 2px; }
.cap { font-size: 20px; line-height: 1.5; min-height: 60px; max-width: 70ch; }
.cap code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .9em; }
.controls { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
button {
  font: inherit; font-size: 15px; padding: 7px 16px; cursor: pointer;
  background: var(--btn); color: var(--text);
  border: 1px solid var(--btn-border); border-radius: 8px;
}
button:focus-visible { outline: 2px solid var(--p-stroke); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); margin-left: auto; }
@media (prefers-reduced-motion: reduce) { .k { transition: none; } }
</style>
</head>
<body>
<main>
<h1>How the research team works</h1>

<svg id="wf" viewBox="0 0 680 340" role="img" aria-labelledby="t d">
<title id="t">Multi-agent deep research workflow</title>
<desc id="d">The user sends a research question to a lead agent. The lead sends sub-questions to a researcher agent and findings to a verifier agent. Each agent's tools are listed inside its box. Our code checks the sources in every reply before it reaches the lead, which writes the final report.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="k box" data-k="user"><rect x="270" y="20" width="140" height="44" rx="8" stroke-width="1"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">User</text></g>

<line class="arr k" data-k="a-um" x1="320" y1="66" x2="320" y2="106" marker-end="url(#arrow)"/>
<line class="arr k" data-k="a-mu" x1="360" y1="108" x2="360" y2="68" marker-end="url(#arrow)"/>

<g class="k purple" data-k="main"><rect x="150" y="110" width="380" height="72" rx="8" stroke-width="1"/>
<text class="th" x="340" y="128" text-anchor="middle" dominant-baseline="central">Lead agent</text>
<text class="tr" x="340" y="147" text-anchor="middle" dominant-baseline="central">plans, delegates, writes the report</text>
<text class="ts" x="340" y="166" text-anchor="middle" dominant-baseline="central">🔧 write_todos, ask_researcher, ask_verifier</text></g>

<line class="arr k" data-k="a-mr" x1="230" y1="184" x2="140" y2="246" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line class="arr k" data-k="a-rm" x1="190" y1="248" x2="275" y2="186" marker-end="url(#arrow)"/>
<line class="arr k" data-k="a-mv" x1="450" y1="184" x2="540" y2="246" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line class="arr k" data-k="a-vm" x1="490" y1="248" x2="405" y2="186" marker-end="url(#arrow)"/>

<text class="note k" data-k="chk" x="340" y="226" text-anchor="middle" dominant-baseline="central">✓ every reply checked by code</text>

<g class="k teal" data-k="res"><rect x="30" y="250" width="260" height="72" rx="8" stroke-width="1"/>
<text class="th" x="160" y="268" text-anchor="middle" dominant-baseline="central">Researcher agent</text>
<text class="tr" x="160" y="287" text-anchor="middle" dominant-baseline="central">searches and reads the web</text>
<text class="ts" x="160" y="306" text-anchor="middle" dominant-baseline="central">🔧 web_search, extract_page</text></g>

<g class="k teal" data-k="ver"><rect x="390" y="250" width="260" height="72" rx="8" stroke-width="1"/>
<text class="th" x="520" y="268" text-anchor="middle" dominant-baseline="central">Verifier agent</text>
<text class="tr" x="520" y="287" text-anchor="middle" dominant-baseline="central">checks claims on official sites</text>
<text class="ts" x="520" y="306" text-anchor="middle" dominant-baseline="central">🔧 official_search, extract_page</text></g>
</svg>

<div class="panel">
  <div class="dots" id="dots"></div>
  <div class="num" id="num">Overview</div>
  <div class="cap" id="cap" aria-live="polite"></div>
  <div class="controls">
    <button onclick="go(-1)">Previous</button>
    <button onclick="go(1)">Next</button>
    <button onclick="show(-1)">Show all</button>
    <span class="hint">Keys: ← → or space, Esc for overview</span>
  </div>
</div>
</main>

<script>
const OVERVIEW = "Boxes are agents. The 🔧 line in each box lists that agent's tools. Dashed arrows are instructions, solid arrows are replies.";
const S = [
  ["The user asks a big research question, like “Compare LangGraph, CrewAI and AutoGen” or “What is MCP?”", ["user","a-um","main"]],
  ["The lead plans first. With its <code>write_todos</code> tool it writes a todo list: one sub-question per industry, plus “Verify” and “Write report”.", ["main"]],
  ["The lead never searches itself. It calls <code>ask_researcher</code> once per sub-question, several at the same time.", ["main","a-mr","res"]],
  ["The researcher uses its 2 tools: <code>web_search</code> finds pages (titles + short snippets), <code>extract_page</code> reads the best pages in full. Both use the Tavily API. Then it writes findings: the fact, who it is about, an evidence quote, and the source.", ["res"]],
  ["Before the reply reaches the lead, our code checks it: every URL must be a page that <code>extract_page</code> really read. Unread URLs are flagged as possible hallucinations.", ["res","a-rm","chk","main"]],
  ["The lead calls <code>ask_verifier</code>. Our code (not the lead) passes all the researchers’ findings to the verifier, exactly as written, so nothing gets changed or invented on the way.", ["main","a-mv","ver"]],
  ["The verifier checks each finding on the official website of whoever it is about (e.g. anthropic.com, langchain.com) with <code>official_search</code> and <code>extract_page</code>. It marks each finding VERIFIED, NOT VERIFIED, or NOT CHECKED (opinions).", ["ver"]],
  ["Our code checks every ✅: the page must really be read and be on the official domain that the <i>researcher</i> named (the verifier can’t swap in a blog’s domain). If not, the code changes it to NOT VERIFIED.", ["ver","a-vm","chk","main"]],
  ["The lead writes the report: in the shape that fits the question (comparison table, top-N list, or sections), ✅ / ❌ / ➖ per fact, with sources.", ["main","a-mu","user"]]
];
let i = -1;
const wf = document.getElementById("wf"), dots = document.getElementById("dots");
const num = document.getElementById("num"), cap = document.getElementById("cap");
S.forEach(() => { const d = document.createElement("span"); d.className = "dot"; dots.appendChild(d); });

function show(n) {
  i = n;
  wf.querySelectorAll(".k").forEach(e => e.classList.remove("on"));
  [...dots.children].forEach((d, j) => d.classList.toggle("on", j === n));
  if (n < 0) { wf.classList.remove("dim"); num.textContent = "Overview"; cap.innerHTML = OVERVIEW; return; }
  wf.classList.add("dim");
  S[n][1].forEach(k => wf.querySelectorAll('[data-k="' + k + '"]').forEach(e => e.classList.add("on")));
  num.textContent = "Step " + (n + 1) + " of " + S.length;
  cap.innerHTML = S[n][0];
}
function go(d) {
  let n = i + d;
  if (n >= S.length) n = -1;
  if (n < -1) n = S.length - 1;
  show(n);
}
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  else if (e.key === "Escape") { show(-1); }
});
show(-1);
</script>
</body>
</html>
